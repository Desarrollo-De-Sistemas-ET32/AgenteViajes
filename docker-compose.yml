services:
  mysql:
    image: mysql:8.0
    container_name: AmelieDB
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 123
      MYSQL_DATABASE: AmelieSQL
      MYSQL_USER: usuario
      MYSQL_PASSWORD: 123
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
